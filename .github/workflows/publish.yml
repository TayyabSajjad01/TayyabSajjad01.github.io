name: Publish Tayyab's portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand the initial browser upload
        if: hashFiles('portfolio-source.zip') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          with ZipFile('portfolio-source.zip') as archive:
              for entry in archive.infolist():
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root) or entry.filename.startswith(('.github/', '.git/')):
                      raise ValueError('Unexpected archive path')
              archive.extractall(root)
          Path('portfolio-source.zip').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets content scripts package.json README.md .gitignore .env.example
          git add -u portfolio-source.zip
          git commit -m "Add portfolio source, service guides and free call requests"
          git push origin HEAD:main
      - name: Select source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the email handler without sending messages
        run: node scripts/test-contact-api.mjs
      - name: Build the public website
        run: npm run build
        env:
          PUBLIC_BUILD: 'true'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
